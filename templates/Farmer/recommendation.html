<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>DigitalAgri — Get Recommendation</title>
<link rel="icon" type="image/png" href="{{ url_for('static', filename='logo.png') }}">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Lora:wght@500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lucide-static@0.321.0/font/lucide.min.css"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --green-900:#0D3320;--green-800:#14472D;--green-700:#1A5C3A;
  --green-600:#1E7045;--green-500:#22884F;--green-400:#2BA563;
  --green-300:#4FBF80;--green-200:#A8DFBF;--green-100:#D4EFE0;--green-50:#EEF8F3;
  --green-accent:#1D9E75;

  --sidebar-bg:#14472D;--sidebar-hover:rgba(255,255,255,0.09);
  --sidebar-active:rgba(255,255,255,0.16);--sidebar-text:rgba(255,255,255,0.72);
  --sidebar-text-active:#fff;

  --topbar-bg:#fff;--topbar-border:#E8EDF0;
  --bg:#F2F6F3;--surface:#fff;--surface-2:#F7FAF8;
  --border:#E4EBE7;--border-2:#D0DDD6;--border-tertiary:#E8EDF0;
  --text-primary:#0F2419;--text-secondary:#4A6355;--text-muted:#8BA898;

  --blue:#3B82F6;--blue-light:#EFF6FF;
  --amber:#F59E0B;--amber-light:#FFFBEB;
  --rose:#F43F5E;--rose-light:#FFF1F2;
  --violet:#8B5CF6;--violet-light:#F5F3FF;
  --teal:#14B8A6;--teal-light:#F0FDFA;
  --cyan:#06B6D4;--cyan-light:#ECFEFF;

  --shadow-sm:0 1px 3px rgba(15,36,25,0.06),0 1px 2px rgba(15,36,25,0.04);
  --shadow:0 4px 12px rgba(15,36,25,0.08),0 2px 4px rgba(15,36,25,0.04);
  --shadow-md:0 8px 24px rgba(15,36,25,0.1),0 4px 8px rgba(15,36,25,0.05);
  --shadow-lg:0 20px 48px rgba(15,36,25,0.12),0 8px 16px rgba(15,36,25,0.06);

  --radius:12px;--radius-lg:16px;--radius-xl:20px;
  --sidebar-w:248px;--topbar-h:64px;
  --font:'Plus Jakarta Sans',sans-serif;
  --font-display:'Lora',Georgia,serif;
  --transition:0.22s cubic-bezier(0.4,0,0.2,1);
}

[data-theme="dark"]{
  --sidebar-bg:#0A2118;--sidebar-hover:rgba(255,255,255,0.07);
  --sidebar-active:rgba(75,191,128,0.18);--sidebar-text:rgba(255,255,255,0.58);
  --sidebar-text-active:#fff;
  --topbar-bg:#0F1E16;--topbar-border:#1C3327;
  --bg:#0C1A11;--surface:#112019;--surface-2:#162A1E;
  --border:#1E3528;--border-2:#264538;--border-tertiary:#1C3327;
  --text-primary:#E8F5EE;--text-secondary:#7BAF94;--text-muted:#4A7060;
  --blue-light:#172554;--amber-light:#1C1400;--rose-light:#1F0A10;
  --violet-light:#1B1030;--teal-light:#042F2E;--cyan-light:#083344;
  --shadow-sm:0 1px 3px rgba(0,0,0,0.3);--shadow:0 4px 12px rgba(0,0,0,0.35);
  --shadow-md:0 8px 24px rgba(0,0,0,0.4);--shadow-lg:0 20px 48px rgba(0,0,0,0.5);
}

html,body{height:100%;font-family:var(--font);background:var(--bg);color:var(--text-primary);transition:background var(--transition),color var(--transition)}

/* ── APP SHELL ── */
.app{display:flex;height:100vh;overflow:hidden}

/* ── PAGE HEADER ── */
.page-header{margin-bottom:26px}
.page-title{font-family:var(--font-display);font-size:26px;font-weight:600;color:var(--text-primary);letter-spacing:-0.3px;margin-bottom:1px}
.page-sub{font-size:14px;color:var(--text-muted);display:flex;align-items:center;gap:8px}

/* ── SIDEBAR ── */
.sidebar{
  width:var(--sidebar-w);flex-shrink:0;background:var(--sidebar-bg);
  display:flex;flex-direction:column;z-index:20;position:relative;overflow:hidden;
  transition:background var(--transition);
}
.sidebar::before{content:'';position:absolute;top:-80px;right:-60px;width:220px;height:220px;
  background:radial-gradient(circle,rgba(75,191,128,0.1) 0%,transparent 70%);pointer-events:none}

.sidebar-logo{display:flex;align-items:center;gap:10px;padding:20px 18px 16px;
  border-bottom:1px solid rgba(255,255,255,0.07)}
.logo-mark{width:34px;height:34px;background:var(--green-400);border-radius:9px;
  display:flex;align-items:center;justify-content:center;flex-shrink:0}
.logo-name{font-family:var(--font-display);font-size:17px;font-weight:600;color:#fff;letter-spacing:-0.2px}
.logo-name span{color:var(--green-300)}
.admin-badge{font-size:9.5px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;
  background:rgba(245,158,11,0.25);color:#FCD34D;padding:2px 7px;border-radius:20px;margin-left:auto}

.sidebar-nav{flex:1;overflow-y:auto;padding:6px 10px 8px}
.sidebar-nav::-webkit-scrollbar{width:0}

.section-label{font-size:10px;font-weight:700;letter-spacing:0.1em;color:rgba(255,255,255,0.35);
  text-transform:uppercase;padding:14px 8px 5px}

.nav-item{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:10px;
  cursor:pointer;transition:all var(--transition);color:var(--sidebar-text);
  font-size:13.5px;font-weight:500;text-decoration:none;margin-bottom:2px;position:relative}
.nav-item:hover{background:var(--sidebar-hover);color:var(--sidebar-text-active)}
.nav-item.active{background:var(--sidebar-active);color:var(--sidebar-text-active)}
.nav-item.active::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);
  width:3px;height:60%;background:var(--green-300);border-radius:0 3px 3px 0}
.nav-icon{width:17px;height:17px;flex-shrink:0;opacity:0.8}
.nav-item.active .nav-icon,.nav-item:hover .nav-icon{opacity:1}
.nav-badge{margin-left:auto;background:rgba(244,63,94,0.25);color:#FDA4AF;
  font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px}
.nav-badge.green{background:rgba(75,191,128,0.2);color:var(--green-200)}

/* ── MAIN ── */
.main{flex:1;overflow-y:auto;background:var(--bg)}

/* ── TOPBAR ── */
.topbar{height:var(--topbar-h);background:var(--topbar-bg);border-bottom:1px solid var(--topbar-border);
  display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:10;
  flex-shrink:0}
.breadcrumb{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-muted)}
.breadcrumb a{color:var(--text-secondary);text-decoration:none;transition:color var(--transition)}
.breadcrumb a:hover{color:var(--text-primary)}
.breadcrumb .sep{color:var(--text-muted);font-weight:400}
.breadcrumb .current{color:var(--text-primary);font-weight:500}

.search-bar{display:flex;align-items:center;gap:7px;background:var(--surface);
  border:1.5px solid var(--border);border-radius:10px;padding:0 12px;height:36px;min-width:280px;
  transition:border-color var(--transition)}
.search-bar:focus-within{border-color:var(--green-400);box-shadow:0 0 0 3px rgba(43,165,99,0.08)}
.search-icon{color:var(--text-muted);flex-shrink:0}
.search-bar input{border:none;background:transparent;font-family:var(--font);
  font-size:13px;color:var(--text-primary);outline:none;width:100%;flex:1}
.search-bar input::placeholder{color:var(--text-muted)}

.topbar-actions{display:flex;align-items:center;gap:12px}
.icon-btn{width:36px;height:36px;border-radius:9px;border:1.5px solid var(--border);
  background:var(--surface);cursor:pointer;display:flex;align-items:center;justify-content:center;
  color:var(--text-muted);transition:all var(--transition);position:relative}
.icon-btn:hover{border-color:var(--green-400);color:var(--green-600);transform:scale(1.05)}
.notif-dot{position:absolute;top:8px;right:8px;width:8px;height:8px;background:var(--rose);
  border-radius:50%;border:2px solid var(--topbar-bg)}
.theme-toggle{width:36px;height:36px;border-radius:9px;border:1.5px solid var(--border);
  background:var(--surface);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;
  color:var(--text-muted);transition:all var(--transition)}
.theme-toggle:hover{border-color:var(--green-400);color:var(--green-600)}
.user-btn{display:flex;align-items:center;gap:9px;padding:0 12px 0 6px;height:38px;
  border-radius:10px;border:1.5px solid var(--border);background:var(--surface);
  cursor:pointer;transition:all var(--transition);font-size:13px;font-weight:600;color:var(--text-primary)}
.user-btn:hover{border-color:var(--green-400);transform:translateY(-1px);box-shadow:var(--shadow-sm)}
.avatar{width:26px;height:26px;border-radius:7px;
  background:linear-gradient(135deg,var(--amber),#D97706);
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff}

/* ── CONTENT ── */
.content{padding:24px;min-height:calc(100vh - var(--topbar-h))}

/* ── FORM CARD ── */
.form-card{background:var(--surface);border:0.5px solid var(--border-tertiary);border-radius:var(--radius-lg);
  padding:1.5rem;box-shadow:var(--shadow-sm);margin-bottom:24px}
.card-header{margin-bottom:20px;padding-left:12px;border-left:3px solid var(--green-accent)}
.card-label{font-size:11px;font-weight:700;letter-spacing:0.07em;text-transform:uppercase;color:var(--text-muted)}
.card-title{font-size:18px;font-weight:700;color:var(--text-primary);margin-top:4px}
.card-subtitle{font-size:13px;color:var(--text-secondary);margin-top:2px}

/* ── TWO COLUMN FORM ── */
.form-two-columns{display:grid;grid-template-columns:1fr 1px 1fr;gap:24px}
.column-divider{background:var(--border-tertiary);height:100%}
.form-column{display:flex;flex-direction:column;gap:16px}

.column-header{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.column-header-icon{width:20px;height:20px;color:var(--green-accent)}
.column-header-title{font-size:14px;font-weight:600;color:var(--text-primary)}

/* ── FORM GROUPS ── */
.form-group{margin-bottom:0}
.form-label{display:block;font-size:13px;font-weight:600;color:var(--text-primary);margin-bottom:6px}
.form-input,.form-select{width:100%;padding:10px 12px;border:1.5px solid var(--border);
  border-radius:8px;font-family:var(--font);font-size:14px;color:var(--text-primary);
  background:var(--surface);transition:border-color var(--transition),box-shadow var(--transition)}
.form-input:focus,.form-select:focus{outline:none;border-color:var(--green-400);
  box-shadow:0 0 0 3px rgba(43,165,99,0.08)}
.form-input::placeholder{color:var(--text-muted)}
.form-select{cursor:pointer}
.form-hint{font-size:11px;color:var(--text-muted);margin-top:4px}

/* ── INFO CHIP ── */
.info-chip{display:inline-flex;align-items:center;gap:6px;background:var(--green-50);
  color:var(--green-700);padding:6px 10px;border-radius:6px;font-size:12px;font-weight:500;
  margin-top:8px;animation:slideIn 0.3s ease-out}
@keyframes slideIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}

/* ── SEASON TOGGLES ── */
.season-toggles{display:flex;gap:8px}
.season-toggle{flex:1;padding:10px 12px;border:1.5px solid var(--green-400);border-radius:8px;
  font-family:var(--font);font-size:13px;font-weight:600;color:var(--green-600);
  background:var(--surface);cursor:pointer;transition:all var(--transition);text-align:center}
.season-toggle:hover{background:var(--green-50)}
.season-toggle.active{background:var(--green-accent);color:#fff;border-color:var(--green-accent)}

/* ── ALTITUDE GLOW ── */
.form-input.glow{border-color:var(--green-400);box-shadow:0 0 0 3px rgba(43,165,99,0.08)}

/* ── SUB-GROUPS ── */
.sub-group{margin-bottom:16px}
.sub-group-label{display:flex;align-items:center;gap:6px;margin-bottom:10px}
.pill-badge{font-size:10px;font-weight:600;padding:3px 8px;border-radius:12px;text-transform:uppercase;letter-spacing:0.05em}
.pill-badge.gray{background:var(--surface-2);color:var(--text-muted)}
.pill-badge.amber{background:var(--amber-light);color:var(--amber)}
.external-link{color:var(--text-muted);text-decoration:none;transition:color var(--transition)}
.external-link:hover{color:var(--amber)}

/* ── FIELD GRIDS ── */
.field-grid-2x2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field-grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}

/* ── SUBMIT BUTTON ── */
.btn-submit{width:100%;height:44px;background:var(--green-accent);color:#fff;border:none;
  border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;font-family:var(--font);
  transition:all var(--transition);display:flex;align-items:center;justify-content:center;gap:8px;
  box-shadow:0 2px 8px rgba(29,158,117,0.3)}
.btn-submit:hover{background:var(--green-600);transform:translateY(-1px);
  box-shadow:0 4px 14px rgba(29,158,117,0.4)}
.btn-submit:disabled{opacity:0.7;cursor:not-allowed;transform:none}
.btn-submit-icon{width:16px;height:16px}
.btn-submit.loading .btn-submit-text{display:none}
.btn-submit.loading .spinner{display:block}
.btn-submit.success{background:var(--green-700)}
.spinner{display:none;width:16px;height:16px;border:2px solid rgba(255,255,255,0.3);
  border-top-color:#fff;border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── TABLE SECTION ── */
.table-section{margin-top:24px}
.table-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.table-title{font-size:16px;font-weight:700;color:var(--text-primary)}
.count-badge{background:var(--surface-2);color:var(--text-muted);font-size:12px;font-weight:600;
  padding:4px 10px;border-radius:12px;margin-left:8px}
.table-search{display:flex;align-items:center;gap:8px;background:var(--surface);
  border:1.5px solid var(--border);border-radius:10px;padding:0 12px;height:36px;width:280px;
  transition:border-color var(--transition)}
.table-search:focus-within{border-color:var(--green-400);box-shadow:0 0 0 3px rgba(43,165,99,0.08)}
.table-search input{border:none;background:transparent;font-family:var(--font);
  font-size:13px;color:var(--text-primary);outline:none;width:100%;flex:1}
.table-search input::placeholder{color:var(--text-muted)}

/* ── RECOMMENDATIONS TABLE ── */
.recommendations-table{background:var(--surface);border:0.5px solid var(--border-tertiary);
  border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow-sm)}
table.rec-table{width:100%;border-collapse:collapse;font-size:13px}
.rec-table th{text-align:left;font-size:11px;font-weight:700;letter-spacing:0.07em;
  text-transform:uppercase;color:var(--text-muted);padding:12px 16px;border-bottom:1px solid var(--border-2)}
.rec-table td{padding:12px 16px;border-bottom:1px solid var(--border);
  color:var(--text-secondary);vertical-align:middle}
.rec-table tbody tr{transition:background var(--transition);opacity:0;animation:fadeIn 0.3s ease-out forwards}
.rec-table tbody tr:hover{background:var(--surface-2)}
.rec-table tbody tr.new-row{border-left:3px solid var(--green-accent);background:var(--green-50);
  animation:fadeInHighlight 0.3s ease-out forwards}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeInHighlight{from{opacity:0;transform:translateY(10px);background:var(--green-50)}
  to{opacity:1;transform:translateY(0);background:var(--green-50)}}
.rec-table tbody tr.new-row.fade-out{transition:background 3s ease-out;background:var(--surface)}

.farmer-cell-name{font-weight:600;color:var(--text-primary);font-size:13px}
.farmer-cell-district{font-size:11px;color:var(--text-muted);margin-top:2px}

.season-badge{font-size:11px;font-weight:600;padding:3px 8px;border-radius:6px;background:var(--amber-light);color:var(--amber)}

.crop-cell{display:flex;align-items:center;gap:6px;font-weight:600;color:var(--text-primary)}
.crop-icon{width:14px;height:14px;color:var(--green-500)}

.predictions-list{display:flex;flex-direction:column;gap:4px}
.prediction-item{display:flex;align-items:center;gap:6px;font-size:12px}
.prediction-rank{font-weight:600;color:var(--text-muted);min-width:20px}
.prediction-crop{font-weight:600;color:var(--text-primary);flex:1}
.prediction-confidence{font-weight:600;color:var(--green-600)}
.no-predictions{color:var(--text-muted);font-size:13px}

.confidence-badge{font-size:11px;font-weight:600;padding:3px 8px;border-radius:6px;background:var(--green-50);color:var(--green-700)}

.btn-view{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border:1.5px solid var(--border);
  border-radius:6px;font-size:12px;font-weight:600;color:var(--text-secondary);background:var(--surface);
  cursor:pointer;transition:all var(--transition);text-decoration:none}
.btn-view:hover{border-color:var(--green-400);color:var(--green-600)}
.btn-view-icon{width:14px;height:14px}

/* ── EMPTY STATE ── */
.empty-state{text-align:center;padding:48px 24px}
.empty-state-icon{width:48px;height:48px;color:var(--green-500);margin-bottom:16px}
.empty-state-text{font-size:14px;color:var(--text-muted)}

.nav-item.logout{color:rgba(255,120,120,0.7)}
.nav-item.logout:hover{background:rgba(244,63,94,0.1);color:#ff7b7b}


/* Responsive */
@media(max-width:720px){
  :root{--sidebar-w:0px}
  .sidebar{display:none}
  .content{padding:16px}
  .form-two-columns{grid-template-columns:1fr}
  .column-divider{display:none}
  .field-grid-2x2{grid-template-columns:1fr}
  .field-grid-3{grid-template-columns:1fr}
  .table-header{flex-direction:column;align-items:stretch;gap:12px}
  .table-search{width:100%}
}
</style>
</head>
<body>
<div class="app">
{% include 'Farmer/components/sidebar.html' %}

<div class="main">
  {% include 'Farmer/components/topbar.html' %}

  <div class="content">

    <div class="page-header">
        <div>
          <div class="page-title">Get Crop Recommendation</div>
          <div class="page-sub">
          Enter farm conditions to get ML-based crop prediction
          </div>
        </div>  
    </div>
    <!-- Section 1: Form Card -->

    <div class="form-card">

      <form id="recommendationForm" method="post" action="{{ url_for('get_recommendation') }}">
        <div class="form-two-columns">
          <!-- Left Column -->
          <div class="form-column">
            <div class="column-header">
              <svg class="column-header-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>
              <span class="column-header-title">Farm & Farmer Info</span>
            </div>

            <div class="form-group">
              <label class="form-label">Select Farmer</label>
              <select class="form-select" id="farmerSelect" name="farmer_id" onchange="showFarmerDistrict()">
                <option value="">Choose a farmer...</option>
                {% for farmer in farmers %}
                  <option value="{{ farmer.id }}" data-district="{{ farmer.farmer_district }}">{{ farmer.name }}</option>
                {% endfor %}
              </select>
              <div id="farmerDistrictChip" class="info-chip" style="display:none;">
                <svg width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>
                <span id="farmerDistrictText">Home district: </span>
              </div>
            </div>

            <div class="form-group">
              <label class="form-label">Farm District</label>
              <select class="form-select" id="farmDistrict" name="farm_district" onchange="suggestAltitude()">
                <option value="">Where is the farm located?</option>
                {% for district in rwanda_districts %}
                  <option value="{{ district }}">{{ district }}</option>
                {% endfor %}
              </select>
            </div>

            <div class="form-group">
              <label class="form-label">Season</label>
              <div class="season-toggles">
                <button type="button" class="season-toggle active" data-season="A" onclick="selectSeason(this)">Season A <br> <small>(Sep–Feb)</small></button>
                <button type="button" class="season-toggle" data-season="B" onclick="selectSeason(this)">Season B <br> <small>(Mar–Jun)</small></button>
                <button type="button" class="season-toggle" data-season="C" onclick="selectSeason(this)">Season C <br> <small>(Jul–Sep)</small></button>
              </div>
              <input type="hidden" id="selectedSeason" name="season" value="A">
            </div>

            <div class="form-group">
              <label class="form-label">Altitude (m)</label>
              <input type="number" class="form-input" id="altitude" name="altitude" placeholder="e.g., 1800" step="10">
              <div id="altitudeHint" class="form-hint" style="display:none;"></div>
            </div>
          </div>

          <!-- Divider -->
          <div class="column-divider"></div>

          <!-- Right Column -->
          <div class="form-column">
            <div class="column-header">
              <svg class="column-header-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/><line x1="2" y1="20" x2="2" y2="16"/></svg>
              <span class="column-header-title">Farm Conditions</span>
            </div>

            <!-- Soil Data Group -->
            <div class="sub-group">
              <div class="sub-group-label">
                <span class="pill-badge gray">Soil test results</span>
              </div>
              <div class="field-grid-2x2">
                <div class="form-group">
                  <label class="form-label">Soil pH</label>
                  <input type="number" class="form-input" name="soil_ph" placeholder="e.g. 6.5" step="0.1" min="4" max="8.5">
                  <div class="form-hint">Range: 4.0 – 8.5</div>
                </div>
                <div class="form-group">
                  <label class="form-label">Nitrogen</label>
                  <input type="number" class="form-input" name="nitrogen" placeholder="kg/ha" step="1">
                </div>
                <div class="form-group">
                  <label class="form-label">Phosphorus</label>
                  <input type="number" class="form-input" name="phosphorus" placeholder="kg/ha" step="1">
                </div>
                <div class="form-group">
                  <label class="form-label">Potassium</label>
                  <input type="number" class="form-input" name="potassium" placeholder="kg/ha" step="1">
                </div>
              </div>
            </div>

            <!-- Weather Data Group -->
            <div class="sub-group">
              <div class="sub-group-label">
                <span class="pill-badge amber">From Meteo Rwanda</span>
                <a href="https://www.meteorwanda.gov.rw/" target="_blank" class="external-link" style="margin-left:8px;">
                  <svg width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15,3 21,3 21,9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
                </a>
              </div>
              <div class="field-grid-3">
                <div class="form-group">
                  <label class="form-label">Rainfall (mm)</label>
                  <input type="number" class="form-input" name="rainfall" placeholder="mm" step="1">
                </div>
                <div class="form-group">
                  <label class="form-label">Temperature (°C)</label>
                  <input type="number" class="form-input" name="temperature" placeholder="°C" step="0.1">
                </div>
                <div class="form-group">
                  <label class="form-label">Humidity (%)</label>
                  <input type="number" class="form-input" name="humidity" placeholder="%" step="1" min="0" max="100">
                </div>
              </div>
            </div>
          </div>
        </div>

        <button type="submit" class="btn-submit" id="submitBtn">
          <svg class="btn-submit-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
          <span class="btn-submit-text">Get Recommendation →</span>
          <div class="spinner"></div>
        </button>
      </form>
    </div>


  </div>
</div>
</div>

<script>
// District altitude suggestions
const districtAltitudes = {
  "Kigali": 1567,
  "Nyarugenge": 1567,
  "Gasabo": 1567,
  "Kicukiro": 1567,
  "Burera": 2300,
  "Gicumbi": 1850,
  "Musanze": 1800,
  "Rulindo": 1900,
  "Gisagara": 1450,
  "Huye": 1700,
  "Kamonyi": 1600,
  "Muhanga": 1650,
  "Nyamagabe": 2000,
  "Nyanza": 1550,
  "Ruhango": 1600,
  "Bugesera": 1400,
  "Gatsibo": 1500,
  "Kayonza": 1450,
  "Kirehe": 1500,
  "Ngoma": 1400,
  "Rwamagana": 1550,
  "Karongi": 1900,
  "Ngororero": 1800,
  "Nyabihu": 2200,
  "Rubavu": 1500,
  "Rutsiro": 1700
};

// Show farmer district chip
function showFarmerDistrict() {
  const select = document.getElementById('farmerSelect');
  const chip = document.getElementById('farmerDistrictChip');
  const text = document.getElementById('farmerDistrictText');
  
  const selectedOption = select.options[select.selectedIndex];
  if (selectedOption.value) {
    const district = selectedOption.getAttribute('data-district');
    text.textContent = 'Home district: ' + (district || 'Not specified');
    chip.style.display = 'inline-flex';
  } else {
    chip.style.display = 'none';
  }
}

// Suggest altitude based on district
function suggestAltitude() {
  const select = document.getElementById('farmDistrict');
  const altitudeInput = document.getElementById('altitude');
  const hint = document.getElementById('altitudeHint');
  
  const district = select.value;
  if (district && districtAltitudes[district]) {
    const suggestedAlt = districtAltitudes[district];
    hint.textContent = 'Suggested for ' + district + ': ~' + suggestedAlt.toLocaleString() + 'm';
    hint.style.display = 'block';
    altitudeInput.classList.add('glow');
    if (!altitudeInput.value) {
      altitudeInput.value = suggestedAlt;
    }
  } else {
    hint.style.display = 'none';
    altitudeInput.classList.remove('glow');
  }
}

// Season toggle selection
function selectSeason(btn) {
  document.querySelectorAll('.season-toggle').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('selectedSeason').value = btn.getAttribute('data-season');
}

// Form submission with animation
document.getElementById('recommendationForm').addEventListener('submit', function(e) {
  const btn = document.getElementById('submitBtn');
  const btnText = btn.querySelector('.btn-submit-text');
  const spinner = btn.querySelector('.spinner');
  
  btn.classList.add('loading');
  btnText.textContent = 'Analyzing farm data...';
  btn.disabled = true;
  
  setTimeout(() => {
    btn.classList.remove('loading');
    btn.classList.add('success');
    btnText.textContent = 'Prediction ready! ✓';
    
    setTimeout(() => {
      btn.classList.remove('success');
      btnText.textContent = 'Get Recommendation →';
      btn.disabled = false;
    }, 1500);
  }, 1500);
});

// Filter table
function filterTable() {
  const searchTerm = document.getElementById('tableSearch').value.toLowerCase();
  const rows = document.querySelectorAll('#recommendationsBody tr');
  
  rows.forEach(row => {
    const farmerName = row.querySelector('.farmer-cell-name').textContent.toLowerCase();
    row.style.display = farmerName.includes(searchTerm) ? '' : 'none';
  });
}

// Theme toggle
function toggleTheme(){
  const h=document.documentElement;
  const dark=h.getAttribute('data-theme')==='dark';
  h.setAttribute('data-theme',dark?'light':'dark');
  document.getElementById('themeBtn').textContent=dark?'☀️':'🌙';
}

// View switching for sidebar
function showView(viewName, element){
  window.location.href = "{{ url_for('dashboard') }}";
}
</script>
</body>
</html>
