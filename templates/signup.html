<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>DigitalAgri — Sign Up</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='logo.png') }}">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Lora:wght@500;600&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="logo-section">
                    <div class="logo-mark">
                        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
                            <circle cx="10" cy="10" r="3.5"/>
                            <line x1="10" y1="2" x2="10" y2="5.5"/>
                            <line x1="10" y1="14.5" x2="10" y2="18"/>
                            <line x1="2" y1="10" x2="5.5" y2="10"/>
                            <line x1="14.5" y1="10" x2="18" y2="10"/>
                            <line x1="4.2" y1="4.2" x2="6.5" y2="6.5"/>
                            <line x1="13.5" y1="13.5" x2="15.8" y2="15.8"/>
                            <line x1="15.8" y1="4.2" x2="13.5" y2="6.5"/>
                            <line x1="6.5" y1="13.5" x2="4.2" y2="15.8"/>
                        </svg>
                    </div>
                    <span class="project-title">DigitalAgri</span>
                </div>
            </div>
            <div class="auth-body">
                <h1 class="auth-title">Create Account</h1>
                <p class="auth-subtitle">Join DigitalAgri to optimize your farming decisions</p>
                
                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% if messages %}
                        {% for category, message in messages %}
                            <div class="alert alert-{{ category }}">
                                {{ message }}
                            </div>
                        {% endfor %}
                    {% endif %}
                {% endwith %}

                 <!-- Role Selector -->
                <div class="role-selector">
                    <div class="role-card">
                        <input type="radio" name="role_select" id="role_farmer" value="farmer" checked>
                        <label class="role-label" for="role_farmer">
                            <div class="role-icon">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                                    <circle cx="12" cy="7" r="4"/>
                                </svg>
                            </div>
                            <span class="role-name">Farmer</span>
                            <span class="role-desc">Personal account</span>
                        </label>
                    </div>
                    <div class="role-card">
                        <input type="radio" name="role_select" id="role_admin" value="cooperative">
                        <label class="role-label" for="role_admin">
                            <div class="role-icon">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                                    <circle cx="9" cy="7" r="4"/>
                                    <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
                                    <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                                </svg>
                            </div>
                            <span class="role-name">Cooperative</span>
                            <span class="role-desc">Organization account</span>
                        </label>
                    </div>
                </div>
                
                <form method="post" action="{{ url_for('signup') }}">

                    <!-- Hidden role field submitted with form -->
                    <input type="hidden" name="role" id="role_value" value="farmer">

                    <!-- Cooperative Name — only for admin -->
                    <div class="conditional-field" id="coop-name-field">
                        <div class="form-group" style="margin-bottom:0">
                            <label class="form-label">Cooperative Name</label>
                            <div class="input-wrapper">
                                <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                                    <circle cx="9" cy="7" r="4"/>
                                    <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
                                    <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                                </svg>
                                <input type="text" name="name" class="form-input" placeholder="Cooperative name" id="coop_name_input" disabled>
                            </div>
                        </div>
                    </div>

                    <!-- Full Name — only for farmer -->
                    <div class="conditional-field visible" id="farmer-name-field">
                        <div class="form-group" style="margin-bottom:0">
                            <label class="form-label">Full Name</label>
                            <div class="input-wrapper">
                                <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                                    <circle cx="12" cy="7" r="4"/>
                                </svg>
                                <input type="text" name="name" class="form-input" placeholder="Your full name" id="farmer_name_input" required>
                            </div>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">Email Address</label>
                        <div class="input-wrapper">
                            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                                <polyline points="22,6 12,13 2,6"></polyline>
                            </svg>
                            <input type="email" name="email" class="form-input" placeholder="farmer@example.com" id="email_input" required>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">Phone Number</label>
                        <div class="input-wrapper">
                            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
                            </svg>
                            <input type="tel" name="phone_number" class="form-input" placeholder="+250 788 123 456" required>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">District</label>
                        <select name="district" class="form-select" required>
                            <option value="">Select your district</option>
                            {% for district in districts %}
                                <option value="{{ district }}">{{ district }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">Password</label>
                        <div class="input-wrapper">
                            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                            </svg>
                            <input type="password" name="password" class="form-input" placeholder="••••••••" required minlength="6" id="password">
                            <button type="button" class="password-toggle" onclick="togglePassword('password')">
                                <svg id="password-eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                            </button>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">Confirm Password</label>
                        <div class="input-wrapper">
                            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                            </svg>
                            <input type="password" name="confirm_password" class="form-input" placeholder="••••••••" required minlength="6" id="confirm_password">
                            <button type="button" class="password-toggle" onclick="togglePassword('confirm_password')">
                                <svg id="confirm-password-eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                            </button>
                        </div>
                    </div>
                    
                    <button type="submit" class="btn-primary">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                            <circle cx="8.5" cy="7" r="4"></circle>
                            <line x1="20" y1="8" x2="20" y2="14"></line>
                            <line x1="23" y1="11" x2="17" y2="11"></line>
                        </svg>
                        Create Account
                    </button>
                </form>
                
                <div class="auth-divider">
                    <span>or</span>
                </div>
                
                <div class="auth-link">
                    Already have an account? <a href="{{ url_for('signin') }}">Sign in</a>
                </div>
            </div>
        </div>
    </div>
    <script>
        // Role switching logic
        const roleRadios = document.querySelectorAll('input[name="role_select"]');
        const roleValue = document.getElementById('role_value');
        const farmerField = document.getElementById('farmer-name-field');
        const coopField = document.getElementById('coop-name-field');
        const farmerInput = document.getElementById('farmer_name_input');
         const coopInput = document.getElementById('coop_name_input');
         const emailInput = document.getElementById('email_input');

         roleRadios.forEach(radio => {
             radio.addEventListener('change', (e) => {
                 const selectedRole = e.target.value;
                 roleValue.value = selectedRole;
                 
                 if (selectedRole === 'farmer') {
                     farmerField.classList.add('visible');
                     coopField.classList.remove('visible');
                     farmerInput.setAttribute('required', '');
                     coopInput.removeAttribute('required');
                     farmerInput.disabled = false;
                     coopInput.disabled = true;
                     emailInput.placeholder = 'farmer@example.com';
                 } else {
                     coopField.classList.add('visible');
                     farmerField.classList.remove('visible');
                     coopInput.setAttribute('required', '');
                     farmerInput.removeAttribute('required');
                     coopInput.disabled = false;
                     farmerInput.disabled = true;
                     emailInput.placeholder = 'cooperative@example.com';
                 }
             });
         });

        // Password toggle
        function togglePassword(fieldId) {
            const passwordInput = document.getElementById(fieldId);
            const eyeIcon = document.getElementById(fieldId + '-eye-icon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>';
            } else {
                passwordInput.type = 'password';
                eyeIcon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>';
            }
        }
    </script>
</body>
</html>
